services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai-knowledge-api

    ports:
      - "8000:8000"

    volumes:
      - ./app:/app/app
      - ./.chroma:/app/.chroma

    environment:
      DATABASE_URL: postgresql://ai_user:ai_password@postgres:5432/ai_knowledge
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b

    depends_on:
      - postgres
      - minio
      - ollama

    restart: unless-stopped


  postgres:
    image: postgres:16

    container_name: ai-knowledge-postgres

    environment:
      POSTGRES_DB: ai_knowledge
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped


  minio:
    image: minio/minio

    container_name: ai-knowledge-minio

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    volumes:
      - minio_data:/data

    command: server /data --console-address ":9001"

    restart: unless-stopped

  ollama:
    image: ollama/ollama

    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"

    container_name: ai-knowledge-ollama

    ports:
    - "11434:11434"

    volumes:
    - ollama_data:/root/.ollama

    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  ollama_data: